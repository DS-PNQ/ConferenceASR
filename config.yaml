# ---- Device / compute ----
device: auto            # auto | cuda | cpu
asr_dtype: auto         # auto | bfloat16 | float16 | float32
mt_dtype: auto
cuda_fallback_on_oom: true

# ---- ASR: local Zipformer zh-en-vi ONNX (sherpa-onnx, CPU) ----
# Folder holds encoder/decoder/joiner .onnx (fp32 + int8) + tokens.txt.
asr_model: D:/CONFERENCE ASR/zipformer zh-en-vi onnx phaseB 2e    # or set ASR_MODEL
asr_provider: cpu      # sherpa-onnx wheels are CPU-only; cuda if you build with GPU
asr_quant: auto        # auto | int8 | fp32  (auto = int8 on cpu, fp32 on cuda). MEASURED i7-13620H, 342 s
                       # real audio (zh news + en ad): int8 RTF 0.058 / 385 MB peak, fp32 0.091 / 531 MB;
                       # 87-97% word agreement, differences split both ways -> int8 stays
asr_threads: 4
asr_hotwords_score: 3.0    # bias recognition toward Glossary terms (both sides of each pair), per
                           # stream; 0 = greedy decode, no biasing. >0 switches to beam search.
                           # MEASURED 9 TTS sentences, same audio: 1.5 fixed PITORCH->PYTORCH and
                           # ZIP FORMER->ZIPFORMER, no change on term-free vi/en/zh; >=2.0 mangled
                           # neighbours (KUBERNETES->KUBERES, WE DEPLOY->WLOY). RTF unchanged (~0.1).
                           # MEASURED 2026-10-13, real audio (311 s zh news, 31 s en ad), terms 教皇/Porsche/
                           # Macan/马克龙/梅拉尼亚: 1.5 -> 教皇 4/7, MACAN 2/3; 3.0 -> 教皇 5/7, MACAN 3/3, no
                           # other word changed vs 1.5; 4.0 = 3.0. Raised to 3.0 (TTS-only damage above is older)
asr_glossary_cutoff: 0.75  # finals: an out-of-lexicon word this close (difflib) to a Glossary word becomes it
                           # (MACON -> MACAN). Lower = more snaps, more wrong ones
asr_lexicon: models/lexicon/words.txt   # scripts/get_lexicon.py (Tatoeba en+vi word counts). Final
                           # transcripts only: an out-of-lexicon en/vi word (>= 4 letters) snaps to the most
                           # frequent close lexicon word; Glossary words are never touched. Missing file = off
asr_lexicon_cutoff: 0.85   # difflib similarity a snap needs. Lower = fixes more mishearings, but also
                           # "corrects" names/jargon missing from Tatoeba (add those to the Glossary)
asr_cuda_final: false      # one-shot ORT re-decode of each final (live + uploads). MEASURED live:
                           # 2-7 s per segment under MT load, same text, and the second model copy
                           # holds +1043 MB RAM -> off: never loaded; finals use the live-stream text
asr_ort_threads: 2         # final re-decode pool. MEASURED under live MT load: default
                           # (10) 13.4 s per 12 s segment, 2 -> 1.2 s, 4 -> 1.0-5.4 s
asr_ort_provider: cpu      # cpu (verified: 15 s audio in ~1 s) | cuda (this
                           # int8 export crashes mid-inference on CUDA EP)

# ---- Translation (Tencent Hy-MT2: https://huggingface.co/collections/tencent/hy-mt2) ----
mt_model: tencent/Hy-MT2-1.8B-FP8  # compressed-tensors FP8 on CUDA. NOTE: the local
                           # D:/DENSEV2 - reading/HY-MT INT8 ONNX export is prompt-length
                           # broken (fails past a few dozen tokens) and falls to CPU EP
                           # under VRAM contention — re-export with dynamic axes before use.
                           # any HF id here selects the transformers engine instead
mt_tokenizer: tencent/Hy-MT2-1.8B-FP8  # template+vocab source (local dir has none)
mt_onnx_provider: cpu          # MEASURED: this int8 export crashes mid-inference
                               # on CUDA EP (garbage Expand dims); CPU verified clean.
                               # Set cuda to retry after an ORT/CUDA toolchain upgrade.
mt_compile: true           # CUDA-graph the decode step (needs triton-windows in ../pydeps).
                           # MEASURED RTX 4060 same process: 9.6 -> 31.2 tok/s. First
                           # start compiles ~100 s at warmup (cached on disk after).
                           # Also keeps the FP8 weights (mt_engine._FP8Linear, dequant fused
                           # into the decode). MEASURED 18 translations, same output: 4.03 ->
                           # 2.09 GB VRAM, 40.9 -> 50.4 tok/s; warmup 20 -> 33 s (cached).
                           # false (or no triton) = eager decode on an fp16 bake (3.5 GB)
mt_max_new_tokens: 128     # short utterances only; lower = faster (20 s speech ≈ 90 tgt toks)
mt_do_sample: false        # false = greedy decode (fastest, deterministic)
mt_use_cache: true         # KV-cache (repo default false = slow recompute)
mt_kvquant: false          # quanto KV cache. MEASURED RTX 4060 on the fp16 bake:
                           # 12.7 vs 19.3 tok/s off — prompts are short (history is
                           # capped), so the 4x cache saving buys nothing here.
mt_batch: false            # batched multi-target generate. MEASURED 0.09x on this
                           # modeling (no early stop: runs all 256 steps). OFF.
mt_speculative: false      # prompt-lookup speculative decoding (drafter-free, exact:
                           # output identical). MEASURED on RTX 4060, n=3-4 interleaved:
                           # 0.76-1.0x cross-lingual, ~1.0x same-language. No reliable win
                           # on this task, so OFF by default; auto-rule still fires for
                           # src==tgt or ASCII->English where it can only help.
mt_lookup_tokens: 10       # max draft tokens per step
mt_history_turns: 2        # past segments fed as translation context (2 keeps
mt_history_chars: 400      # …prefill short; history is context-only anyway)
mt_max_backlog: 4          # queued finals before shedding: >=4 display lang only,
                           # >=8 skip MT (keeps hour-long sessions live, not 30 min late)
mt_temperature: 0.3
supported_langs: [vi, en, zh]    # app focus languages
default_targets: [en, zh]        # checked by default in UI

# ---- Document OCR (PaddleOCR-VL: https://huggingface.co/PaddlePaddle/PaddleOCR-VL) ----
ocr_model: PaddlePaddle/PaddleOCR-VL  # 0.9B ultra-compact = lightest available
ocr_device: auto             # auto | cuda | cpu (CUDA bf16 ≈ 2 GB VRAM)
ocr_task: ocr                # ocr | table | formula | chart (UI overrides per job)
ocr_max_new_tokens: 1024     # page-level text budget per image
ocr_dpi: 200                 # PDF rasterization resolution
vi_ocr_model: models/vietocr-s2s  # optional VietOCR seq2seq fp16 ONNX (44.7 MB, CPU) from
                             # scripts/get_vietocr.py; re-reads non-CJK PP-OCR lines so Vietnamese keeps
                             # diacritics + boxes. MEASURED ocr_test/samples: vi_sign 'CAMDOXE' -> 'CÁM ĐỖ XE',
                             # ~0.1 s/line; fp32 (89 MB) gave identical text. Missing dir = PP-OCR/VLM as before
translate_chunk_chars: 240   # Translate tab + OCR: chunk cost (CJK x3) so each MT call fits mt_max_new_tokens

# ---- Speaker buttons: offline TTS (sherpa-onnx Piper VITS int8, CPU only = 0 VRAM) ----
tts_dir: models/tts          # <lang>/ voice folders from scripts/get_tts.py: vi vais1000, en ljspeech,
                             # zh chaowen (medium int8, 14-22 MB). Missing language = UI uses the OS voice.
                             # MEASURED i7-13620H, 2 threads: load 1.2-1.8 s, +99-142 MB RAM per voice,
                             # RTF 0.15-0.17; all three read back through the Zipformer ASR near-verbatim
tts_threads: 2               # CPU threads per synth (live ASR keeps its own 4)
tts_idle_unload: 120         # s without a speak request -> voices dropped (RAM back)

# ---- Voice activity (Silero VAD: https://github.com/snakers4/silero-vad) ----
vad_enable: true             # neural speech gate in front of the diarizer;
                             # fail-open (energy-only) when unloadable
vad_device: auto             # auto | cuda | cpu (model is ~2 MB; either is ms-level)
vad_threshold: 0.5           # frame mean-prob >= this = speech
vad_min_speech_frac: 0.3     # finalized segment below this VAD fraction skips
                             # MT entirely (cough/keyboard/HVAC rows stay untranslated)
vad_skip_denoise: false      # also skip DeepFilterNet when VAD frac >= 0.9
                             # (extra ms; off — denoise quality first)

# ---- Voice suppression (DeepFilterNet: https://github.com/Rikorose/DeepFilterNet) ----
noise_suppress: true       # master enable; the UI toggle (default OFF) decides per session.
                           # MEASURED 18 noisy TTS clips (white/fan/babble, 5+10 dB, vi/en/zh), ASR CER
                           # vs clean: none 0.060, gate 0.073, gtcrn 0.088, DF 0.112 -> no denoiser helps
                           # this Zipformer. Live e2e (12 sentences): denoise ON final 0.97 s / all MT
                           # 1.46 s after speech end, OFF 0.69 s / 1.15 s (ON re-decodes every segment)
denoise_mode: gate         # gate = lightest: numpy/scipy spectral gate, 2 ms per s audio
                           # | gtcrn = GTCRN (sherpa-onnx, 0.5 MB, CPU, in-process) 40 ms per s
                           # | deepfilternet = DF in-proc -> DF sidecar -> gate chain, 105-120 ms per s.
                           # 15 s segment: gate 29 ms, gtcrn 597 ms, DF sidecar 1784 ms
gtcrn_model: models/gtcrn/gtcrn_simple.onnx   # sherpa-onnx speech-enhancement-models release; missing = gate
df_model: null             # null = package default (DeepFilterNet3). Alt: DeepFilterNet2, DeepFilterNet
df_post_filter: false      # extra attenuation of very noisy sections
df_atten_lim_db: null      # e.g. 12 = cap suppression at 12 dB, keep some ambience; null = full
df_python: null            # Python with deepfilternet for the sidecar (null = ../dfenv/Scripts/python.exe).
                           # Chain: df in-process -> df sidecar (3.11) -> spectral gate (~2 ms/s audio)

# ---- Conference / diarization ----
sample_rate: 16000
segment_seconds: 5.0             # max chunk for the /api/transcribe upload path, cut at the quietest 50 ms of
                                 # its 2nd half (pause / sentence end), not mid-word. MEASURED 311 s zh news + 31 s
                                 # en ad: sentences come out whole (PRACTICALITY, DRIVER SEAT, 会谈 recovered); same RTF
frame_seconds: 0.5               # mic frame size fed to the streaming recognizer
endpoint_silence: 1.0            # pause (s) that finalizes a segment — breaks at pauses, not mid-word.
                                 # Counted in 0.5 s UI frames, so 0.5 = one silent frame, 1.0 = two.
                                 # MEASURED live e2e, 12 TTS sentences, denoise off: 1.0 -> final text
                                 # 0.69 s / all MT 1.15 s after speech end; 0.5 -> 0.00 s / 0.60 s, same
                                 # rows, last word kept (_finalize pads the look-ahead). ASR CER vs script
                                 # 1.0: 0.053/0.065, 0.5: 0.060/0.076/0.063/0.042 (= noise). 15 s real speech
                                 # stayed one row. Kept at 1.0: mid-sentence pauses of slow talkers are untested at 0.5
endpoint_min_speech: 0.5         # ignore shorter blips
max_segment: 20.0                # force-finalize run-on speech without pauses
ssbd_beta: 0.3                   # SSBD draft bias (paper: 0.2 best quality; 0.3 = +6% draft reuse, -1% COMET)
mt_retranslate_words: 3          # re-translate the live sentence every 3 new words; each run
                                 # drafts off the last (SSBD), so the final only verifies.
                                 # MEASURED 15 s turns: final 0.1-1.1 s vs 0.8-2.2 s scratch
silence_turn_gap: 0.6            # pause (s) that marks a possible speaker turn
max_speakers: 3
diarizer: nemotron               # nemotron (streaming, splits rows at speaker changes) | nemo Titanet | pyannote | volume
use_nemo: false                  # true forces nemo when diarizer isn't nemotron/pyannote
# Nemotron-3-Diarization: app/nemotron_sidecar.py with transformers 5.19 from ../diardeps
# (the backend keeps 4.57 for Hy-MT; NeMo 3.0.0 can't build this RoPE model).
# MEASURED RTX 4060, bf16, per chunk: [3,1] 0.32 s buffer 19-47 ms (8-25% GPU);
# [1,0] 0.08 s 64 ms (77% GPU: falls behind under MT); [6,2] 0.64 s 18-40 ms. 205 MB VRAM.
# Two-voice test: 100% turn consistency in every mode, boundaries within +-60 ms.
nemotron_model: D:/CONFERENCE ASR/Nemotron-3-Diarization   # LOCAL folder (offline); download_models.py fills it once
nemotron_chunk: [3, 1]           # [chunk, right context] in 80 ms frames; [3,1] = 0.32 s, lowest that keeps up
nemotron_dtype: bfloat16         # same speed as float32 (launch-bound), half the VRAM
nemotron_threshold: 0.5          # speaker probability that counts as speech
nemotron_python: null            # null = the backend's own Python (needs torch)
nemotron_deps: null              # null = ../diardeps (pip install --target, see README §5)
diar_split_min: 0.4              # new voice alone this long (s) = speaker change: split the live row
split_token_slack: 0.12          # ASR tokens stamped up to this long after the cut stay with the old speaker.
                                 # MEASURED 7 hand-overs: old speaker's last token <= +0.04 s, new one's first >= +0.22 s
pyannote_model: pyannote/embedding   # gated: accept once at hf.co/pyannote/embedding
pyannote_cos_thresh: 0.55            # below this cosine -> new speaker (to max_speakers)
hf_token: null                       # or HF_TOKEN env / cached `huggingface login`
nemo_embedding_model: nvidia/speakerverification_en_titanet_large
nemo_cos_thresh: 0.55            # below this cosine -> new speaker (to max_speakers)

# ---- Server ----
host: 127.0.0.1
port: 8000
demo_mode: auto                  # auto | true | false ; auto = mock when models can't load
