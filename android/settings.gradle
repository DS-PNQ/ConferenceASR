pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProps = file("local.properties")
        // local.properties is generated by `flutter pub get` / `flutter run`.
        // Fall back to FLUTTER_ROOT so plain Gradle syncs don't hard-fail.
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null) {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }
        assert sdkPath != null, "flutter.sdk not set in local.properties and FLUTTER_ROOT env var not set. FIX: install the Flutter SDK, then open the PROJECT ROOT (D:\\heyitsme, not the android/ folder) and run 'flutter pub get' — this writes flutter.sdk into android/local.properties automatically."
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include(":app")
